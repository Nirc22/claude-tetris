<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="title">TETRIS</h1>
  <button id="theme-toggle" class="theme-switch" type="button" role="switch" aria-checked="false">
    <span class="track"><span class="thumb"></span></span>
    <span>Modo claro</span>
  </button>
  <label class="skin-picker">
    <span>Skin</span>
    <select id="skin-select">
      <option value="retro">Retro</option>
      <option value="neon">Neon</option>
      <option value="pastel">Pastel</option>
      <option value="pixel">Pixel art</option>
    </select>
  </label>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">ENERGY</span>
          <div class="energy-bar"><div id="energy-fill"></div></div>
          <span class="hint" id="energy-hint">0/10</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
          <canvas id="queue-canvas" class="hidden" width="60" height="240"></canvas>
        </div>

        <div class="panel-section hidden" id="hold-section">
          <span class="label" id="hold-label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section hidden" id="effects">
          <span class="label">EFECTOS</span>
          <div class="hint" id="effects-list"></div>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>C</kbd> reservar</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <ul id="ability-menu" class="hidden">
          <li><button type="button" data-ability="1"><kbd>1</kbd> Ver siguientes 5 piezas</button></li>
          <li><button type="button" data-ability="2"><kbd>2</kbd> Intercambiar pieza actual</button></li>
          <li><button type="button" data-ability="3"><kbd>3</kbd> Ralentizar tiempo 10s</button></li>
          <li><button type="button" data-ability="4"><kbd>4</kbd> Deshacer última colocación</button></li>
          <li><button type="button" data-ability="5"><kbd>5</kbd> Reservar pieza (hold)</button></li>
          <li><button type="button" data-cancel="1">Cancelar (Esc)</button></li>
        </ul>
        <div id="pause-menu" class="hidden">
          <ul id="pause-main">
            <li><button type="button" data-pause="resume">Reanudar (Esc)</button></li>
            <li><button type="button" data-pause="restart">Reiniciar</button></li>
            <li><button type="button" data-pause="controls">Ver controles</button></li>
            <li class="pause-level"><label for="start-level">Nivel inicial</label>
              <select id="start-level">
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10</option><option value="11">11</option><option value="12">12</option>
                <option value="13">13</option><option value="14">14</option><option value="15">15</option>
              </select>
            </li>
          </ul>
          <div id="pause-controls" class="hidden">
            <ul>
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>E</kbd> habilidad</li>
              <li><kbd>C</kbd> reservar</li>
              <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
            </ul>
            <button type="button" data-pause="back">Volver</button>
          </div>
        </div>
        <div id="name-entry" class="hidden">
          <label for="name-input">¡Entras en el top 5! Tu nombre:</label>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="12" autocomplete="off" />
            <button id="save-name-btn" type="button">Guardar</button>
          </div>
        </div>
        <div id="records" class="hidden">
          <span class="label">TOP 5</span>
          <ol id="records-list"></ol>
          <p id="records-extra"></p>
          <button id="reset-records-btn" type="button">Borrar records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
